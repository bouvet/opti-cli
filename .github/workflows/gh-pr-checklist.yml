name: PR Checklist Auto Comment

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  post-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          COMMENT_TEXT=$(cat <<'EOF'
          # Team Optimizely Code Review Checklist
          The author of the PR confirms that the code fulfills the requirements from the list
          - [ ] I have fixed any potential issues from the checklist and the PR is ready for review

          ### Type of change
          Please delete options that are not relevant.
          - [ ] Bug fix (non-breaking change which fixes an issue)
          - [ ] New feature (non-breaking change which adds functionality)
          - [ ] Breaking change (fix or feature that would cause existing functionality to not work as expected)

          ### Checklist
          - [ ] Code follows the style guidelines and clean code principles
            - Fitting variable names, no magic numbers, correct grammar and structure
            - Modern written code that is easy to understand
            - No console.logs or unused imports
            - No hardcoded values (colors, breakpoints, etc.) that should be constants
            - Existing utilities and media queries are reused (e.g., larger-than, smaller-than)
          - [ ] I have performed a self-review of my own code
          - [ ] Documentation is updated (if applicable)
          - [ ] Tests are added and all tests pass locally
          - [ ] No security vulnerabilities or secrets exposed in the code
            - No hardcoded keys, passwords, or usernames
            - No known security vulnerabilities
          - [ ] Input validation, sanitization, and escaping are properly implemented
            - Prevents attacks such as cross-site scripting (XSS) and SQL injection
          - [ ] Sensitive data is securely handled and stored
          EOF
          )

          gh pr comment "${PR_URL}" --body "${COMMENT_TEXT}"